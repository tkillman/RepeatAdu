; RepeatAdu - ESP32-C3 SuperMini & SG90 Keyboard Autoclicker
; PlatformIO Project Configuration File

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; ESP32-C3 SuperMini USB-C Native Serial CDC 활성화 플래그 및 컴파일러 경고 억제
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wno-unused-variable

; 필요한 외부 라이브러리 자동 설치
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    bblanchon/ArduinoJson@^7.0.4

; VS Code C/C++ IntelliSense 누락 헤더(FreeRTOS, soc_caps 등) 자동 경로 주입 스크립트
extra_scripts = pre:fix_intellisense.py
